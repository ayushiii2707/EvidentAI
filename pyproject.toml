[project]
name = "evidentai"
version = "0.1.0"
description = "Evidence-driven technical documentation investigation and change-impact analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.25,<2",
    "markdown-it-py>=3.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
]

[project.scripts]
evidentai = "evidentai.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evidentai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# SWIG bindings inside PyMuPDF trigger these on import; not actionable from this project.
filterwarnings = ["ignore:builtin type (SwigPy|swigvarlink):DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated Alembic DDL keeps its long one-line column definitions.
"migrations/versions/*" = ["E501"]
