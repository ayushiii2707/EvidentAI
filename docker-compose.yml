# Local development database. Passwords here are dev-only defaults; override them via .env.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: evidentai
      POSTGRES_USER: evidentai_owner
      POSTGRES_PASSWORD: ${EVIDENTAI_OWNER_PASSWORD:-owner_dev_only}
      EVIDENTAI_APP_PASSWORD: ${EVIDENTAI_APP_PASSWORD:-app_dev_only}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evidentai_owner -d evidentai"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
